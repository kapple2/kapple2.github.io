n을 새 창으로 엽니다">K-마을</a> <a href="#/about" data-link>소개</a> </div> </nav> </header> <main id="view" class="view" tabindex="-1"></main> <footer class="footer"> <script id="_wautkw">var _wau=_wau||[];_wau.push(["map","u0m7npwj29","tkw","250","125","cart","cross-pink"])</script> <script async src="https://waust.at/m.js"></script> </footer> </div> <template id="tpl-home"> <section class="hero"> <div class="hero-media" aria-hidden="true"></div> <div class="hero-copy"> <h1 class="hero-brand">KAPPLE ][</h1> <p class="lede">1983년 즈음 만난 나의 첫 컴퓨터 — 한국형 Apple II plus 호환기.</p> </div> </section> </template> <template id="tpl-about"> <section class="page"> <h1>소개</h1> <div class="prose"> <p> <strong>KAPPLE ][</strong>는 한국의 Apple II plus 호환기입니다. 저는 1983년 무렵, 국민학교에 다니던 시절에 이 컴퓨터를 구입했습니다. 제 인생 첫 컴퓨터였고, 그 위에서 수많은 게임을 즐겼으며 AppleSoft BASIC으로 프로그래밍을 배우고, LISA 어셈블러로 조금의 어셈블리도 익혔습니다. </p> <p> 이 페이지는 그 기억과, Apple II 관련 자료·코드·문서를 모아 두기 위한 공간입니다. </p> </div> <div class="about-stage"> <figure class="inline-figure about-computer"> <a class="home-link" href="https://sungjookim.com/" target="_blank" rel="noopener" aria-label="제 홈페이지 (sungjookim.com)"> <img src="assets/kapple-ii-plus-about.png?v=2" alt="KAPPLE ][ 컴퓨터와 모니터" width="900" height="994"/> </a> </figure> <div class="sam-card" id="sam-card" role="button" tabindex="0" aria-label="S.A.M. 음성 카드: 컴퓨터로 끌어다 놓으면 말을 합니다"> <div class="sam-bubble" aria-hidden="true">저를 끌어다 컴퓨터에 놓아 주세요!</div> <div class="sam-body"> <img src="assets/sam-card.png?v=1" alt="S.A.M. 음성 합성 카드" width="432" height="259" draggable="false"/> </div> </div> </div> <h2>애플2 카페</h2> <div class="prose"> <p> 한국 애플2 컴퓨터 사용자 모임 - 네이버 <strong>Apple2 Cafe</strong> 회원입니다. 닉네임은 <strong>KAPPLE</strong> 입니다. </p> <p> <a class="btn primary" href="https://cafe.naver.com/appleii" target="_blank" rel="noopener"> cafe.naver.com/appleii </a> </p> </div> </section> </template> <template id="tpl-company"> <section class="page"> <h1>회사</h1> <h2>캐플소프트 KAPPLE Software</h2> <div class="company-split"> <div class="prose"> <p> 캐플소프트(KAPPLE Software)는 1983년 서울의 작은 지하 작업실에서 문을 연 Apple II 전용 소프트웨어 회사입니다. 그 무렵 가정과 학교에는 애플2 호환기가 들어오기 시작했는데, 그 화면을 채울 프로그램은 턱없이 부족했습니다. 직원은 세 명이었고, 낮에는 디스켓을 복사하고 밤에는 코드를 짰습니다. </p> <p>캐플소프트는 세 가지 일을 합니다.</p> <ul> <li><strong>한글화</strong> — 해외 명작의 메뉴와 대사를 한글로 옮기고, 화면에 한글 글꼴을 입힙니다.</li> <li><strong>신작</strong> — 애플2에 없던 보드게임과 생활 속 놀이를 BASIC과 어셈블리로 처음부터 만듭니다.</li> <li><strong>이식</strong> — MSX나 다른 기종에서 돌던 작품을 애플2 플러스에 맞춰 옮겨 싣습니다.</li> </ul> <p> 디스켓 한 장에도 밤을 새운 흔적이 남습니다. 캐플소프트의 원칙은 단순합니다. <em>디스켓 한 장에 정성 한 가지.</em> </p> </div> <div class="company-photos"> <figure class="company-photo"> <img src="assets/company-office2.jpg" alt="캐플소프트 사무실" width="1366" height="745" loading="lazy" decoding="async"/> </figure> <figure class="company-photo"> <img src="assets/company-office5.jpg" alt="캐플소프트 작업실" width="1366" height="746" loading="lazy" decoding="async"/> </figure> </div> </div> <details class="fiction-box"> <summary><h2>이 회사는 가상의 회사입니다</h2></summary> <div class="prose"> <p> 여기까지 읽으셨다면 조금 놀라셨을지도 모르겠습니다. 캐플소프트는 <strong>실제로 존재하지 않는 가상의 회사</strong>입니다. 1983년의 서울에도, 지금의 어디에도 이 이름으로 등록된 회사는 없습니다. </p> <p> 애플2 소프트웨어를 소개하는 레트로풍 가상 광고를 꾸며보려고 지어낸 이름입니다. 저장소에 올라온 한글화 게임, 자작 소프트웨어, 포팅 프로그램들은 모두 실제로 동작하는 파일들이지만, ‘캐플소프트’는 이 프로그램들을 진짜 옛날 소프트웨어 회사의 출시작처럼 설정해 보려고 재미로 만든 가상의 레이블입니다. </p> <p>캐플소프트의 프로그램들은 저장소 페이지에서 만날 수 있습니다.</p> <p class="fiction-cta"><a class="btn ghost" href="#/repo" data-link>저장소 보기</a></p> </div> <div class="fiction-dance" aria-hidden="true"><img src="assets/clown-dancing.gif" alt=""/></div> <div class="fiction-bubble" aria-hidden="true">긴장 풀어요, 너무 진지하게 받아들이지 마세요~</div> </details> </section> </template> <template id="tpl-repo"> <section class="page"> <div class="repo-intro"> <div class="repo-intro-text"> <h1>저장소</h1> <div class="prose"> <p> 이 저장소는 Apple II / KAPPLE ][ 관련 코드, 정보, 문서를 모아 두는 곳입니다. </p> <p> 플레이 영상은 <a href="https://www.youtube.com/@%EC%BA%90%ED%94%8C2%EC%B1%84%EB%84%90" target="_blank" rel="noopener">캐플2채널</a> 에 있습니다. </p> </div> <p c
