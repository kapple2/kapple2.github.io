      <h1>소개</h1>
      <div class="prose">
        <p>
          <strong>KAPPLE ][</strong>는 한국의 Apple II plus 호환기입니다.
          저는 1983년 무렵, 국민학교에 다니던 시절에 이 컴퓨터를 구입했습니다.
          제 인생 첫 컴퓨터였고, 그 위에서 수많은 게임을 즐겼으며
          AppleSoft BASIC으로 프로그래밍을 배우고, LISA 어셈블러로 조금의 어셈블리도 익혔습니다.
        </p>
        <p>
          이 페이지는 그 기억과, Apple II 관련 자료·코드·문서를 모아 두기 위한 공간입니다.
